version: '3.8'

services:
  # 1. Reverse Proxy & Automatic TLS (Let's Encrypt / ZeroSSL + HTTP/3 QUIC)
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    networks:
      - app_net

  # 2. Chitrabazaar Next.js Modular Monolith (Web + Domain Services)
  web:
    image: ghcr.io/your-username/chitrabazaar:latest
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=
      - DIRECT_URL=
      - NEXTAUTH_SECRET=
      - NEXTAUTH_URL=
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT=
      - S3_BUCKET=
      - S3_ACCESS_KEY=
      - S3_SECRET_KEY=
      - STRIPE_SECRET_KEY=
      - STRIPE_WEBHOOK_SECRET=
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6144M
    networks:
      - app_net

  # 3. Asynchronous Headless Media Processing Worker (Sharp / libvips)
  worker:
    image: ghcr.io/your-username/chitrabazaar:latest
    command: ["npx", "tsx", "src/worker/index.ts"]
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=
      - S3_ENDPOINT=
      - S3_BUCKET=
      - S3_ACCESS_KEY=
      - S3_SECRET_KEY=
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 6144M
    networks:
      - app_net

  # 4. Watchtower: Continuous Delivery (<45s auto-update from GHCR on git push)
  watchtower:
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
      - WATCHTOWER_INCLUDE_STOPPED=false
      - REPO_USER=
      - REPO_PASS=
    command: web worker
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
